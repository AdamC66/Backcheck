services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - ./backend:/app
      # Seed manifests live outside the build context; the container's WORKDIR is /app,
      # so this lands them exactly where ImportTeams looks (Rails.root/../data).
      - ./data:/data:ro
      # Same reasoning, for RoadmapController reading planning/data directly.
      - ./planning:/planning:ro
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - db

  # Separate process, not the SOLID_QUEUE_IN_PUMA plugin — a job sharing Puma's own
  # process/GVL would still block web requests. Backend's own command runs
  # db:prepare, so this retries until that's actually done (TASK-84).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: bin/jobs
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - db
    restart: on-failure

volumes:
  db_data:
  bundle_cache:
